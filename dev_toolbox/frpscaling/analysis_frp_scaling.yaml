# ─────────────────────────────────────────────
# Analysis Configuration
# ─────────────────────────────────────────────

# Analysis year (calendar year for data/plots)
year: 2024

# ─────────────────────────────────────────────
# Satellite Configuration
# ─────────────────────────────────────────────

# Which satellite streams to process (order controls output order)
# vnp = SNPP VIIRS, vj1 = NOAA-20 VIIRS, vj2 = NOAA-21 VIIRS, mod = Terra MODIS
satellites_to_process:
  - vj2
  - vnp

# Reference/baseline satellite against which others are compared
# vj1 = NOAA-20 VIIRS
baseline_satellite: vj1

# ─────────────────────────────────────────────
# Data Loading Behavior
# ─────────────────────────────────────────────

# True: force re-read from source; False: use cached/intermediate files if present
fresh_load: true

# True: generate/show/save plots; False: skip plotting steps
plot_analysis: true

# ─────────────────────────────────────────────
# Output & Cache Directories
# ─────────────────────────────────────────────

figure_dir: "./v3.3"   # destination for saved figures
cache_dir: "./cache"   # directory for serialized intermediates (e.g., npz/pkl)

# ─────────────────────────────────────────────
# Parallelism
# ─────────────────────────────────────────────

# Number of worker processes/threads (depends on your implementation)
n_workers: 20

# ─────────────────────────────────────────────
# QFED FRP Input Configuration
# ─────────────────────────────────────────────

# Root path to QFED FRP inputs used by the loader functions
base_path: '/discover/nobackup/projects/gmao/geos_aerosols/acollow/QFED/IGBP/FRP/'

prefix: 'QFED V3.3'
