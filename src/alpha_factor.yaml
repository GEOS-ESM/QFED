# Combustion rate constant (ECMWF Tech Memo 596).
Alpha: 1.37e-6
# enhancement factors for species contributing to AOD
enhance_aerosol_factor:
    tropical_forest: 1
    temperate_forest: 1
    boreal_forest: 1
    savanna: 1
    grassland: 1
    agricultural: 1
    peatland: 1
# enhancement factors for non-aerosol species
enhance_gas_factor:
    tropical_forest: 1
    temperate_forest: 1
    boreal_forest: 1
    savanna: 1
    grassland: 1
    agricultural: 1
    peatland: 1
# The satellite scaling factor for VJ1 was derived through a linear regression
# of CO emissions in log space to GFED5 NRT for 2023-2034. VNP and VJ2 are anchored
# to VJ1. MODIS is TBD. These values may change. 
satscale:
    myd: 1
    mod: 1
    vj2: 0.5800
    vj1: 0.6731
    vnp: 0.7033

# biome level anchoring is no longer used and is therefore set to 1 
# until emissions.py is update to remove these fields
myd:
    tropical_forest: 1
    temperate_forest: 1
    boreal_forest: 1
    savanna: 1
    grassland: 1
    agricultural: 1
    peatland: 1
mod:
